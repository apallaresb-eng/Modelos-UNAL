<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plantilla · Oscilador amortiguado</title>
  <meta name="description" content="PLANTILLA: reemplaza el título, la descripción y el contenido por los del tema.">

  <link rel="stylesheet" href="./estilo.css">
  <script type="module" src="./main.js"></script>
</head>
<body>
  <canvas class="escena"></canvas>

  <header class="titulo">

    <p>Mueve las variables y mira cómo la energía se va perdiendo en cada oscilación.</p>
  </header>

  <aside class="lateral">
    <div class="tarjeta ecuacion" data-ecuacion></div>
    <div class="tarjeta" data-variables></div>
    <div class="tarjeta" data-prediccion></div>
  </aside>

  <footer data-herramientas></footer>
